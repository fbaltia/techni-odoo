services:
  web:
    image: odoo:19
    depends_on: [db]
    networks: [odoo-network]
    ports: [8069:8069]
    environment:
      - PASSWORD_FILE=/run/secrets/pass
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - web_data:/var/lib/odoo
    secrets:
      - pass
    command: -- --dev=reload,xml,web

  db:
    image: postgres:18
    networks: [odoo-network]
    hostname: db
    ports: [5433:5432]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD_FILE=/run/secrets/pass
      - PGDATA=/var/lib/postgresql/data/pgdata
    secrets: [pass]
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata

networks:
  odoo-network:

secrets:
  pass: { file: pass.txt }

volumes:
  web_data:
  db_data: